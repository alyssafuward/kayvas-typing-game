<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type the Letter!</title>
<style>
  :root{
    --sky: #6EC6FF;
    --sun: #FFD23F;
    --grass: #5FD068;
    --berry: #FF6F91;
    --ink: #2B2B3C;
    --card: #FFFFFF;
  }
  html,body{
    margin:0; height:100%;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, #BFE9FF 55%, var(--grass) 55%, #7FDB86 100%);
    overflow:hidden;
  }
  .sun{
    position:absolute; top:30px; right:40px;
    width:90px; height:90px; border-radius:50%;
    background: var(--sun);
    box-shadow: 0 0 0 10px rgba(255,210,63,0.35);
  }
  .cloud{
    position:absolute; background:white; border-radius:50px;
    opacity:0.9;
  }
  .stage{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%;
    box-sizing:border-box;
    padding:20px;
    text-align:center;
  }
  .title{
    font-size:2.2rem;
    color:var(--ink);
    text-shadow: 2px 2px 0 white;
    margin-bottom: 10px;
  }
  .card{
    background: var(--card);
    border-radius: 28px;
    padding: 30px 50px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.1);
    display:flex; flex-direction:column; align-items:center;
  }
  .letter{
    font-size: 9rem;
    font-weight:bold;
    color: var(--berry);
    line-height:1;
    user-select:none;
    transition: transform 0.15s ease;
  }
  .letter.pop{
    transform: scale(1.25);
  }
  .instructions{
    font-size:1.3rem;
    color: var(--ink);
    margin-top: 10px;
  }
  .score-row{
    display:flex; gap:30px; margin-top:18px;
    font-size:1.1rem; color: var(--ink);
  }
  .score-row span{ font-weight:bold; }
  .feedback{
    height: 50px;
    font-size:1.6rem;
    margin-top:10px;
    font-weight:bold;
  }
  .feedback.good{ color: var(--grass); }
  .feedback.miss{ color: var(--berry); }
  .stars{
    position:fixed;
    pointer-events:none;
    font-size:2rem;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform: translateY(0) scale(0.6) rotate(0deg); }
    100%{ opacity:0; transform: translateY(-120px) scale(1.4) rotate(30deg); }
  }
  .speaker{
    margin-top:6px;
    background: var(--sky);
    border:none;
    width:44px; height:44px;
    border-radius:50%;
    font-size:1.3rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #4a9fd6;
  }
  .speaker:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #4a9fd6;
  }
  .restart{
    margin-top:16px;
    background: var(--sun);
    border:none;
    padding: 10px 24px;
    border-radius: 20px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow: 0 6px 0 #d9ac1f;
  }
  .restart:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d9ac1f;
  }
  .levels{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .level-btn{
    background: white;
    border: 3px solid var(--sky);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 16px;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    font-size: 0.95rem;
    font-weight:bold;
    cursor:pointer;
  }
  .level-btn.active{
    background: var(--sky);
    color: white;
  }
  .keyboard-wrap{
    margin-top: 18px;
  }
  .key-rect{
    fill: #EDEFF3;
    stroke: #C7CCD6;
    stroke-width: 2;
    transition: fill 0.15s ease, transform 0.15s ease;
  }
  .key-rect.active{
    fill: var(--sun);
    stroke: #D9AC1F;
  }
  .key-rect.key-inactive{
    fill: #F5F6F8;
    stroke: #DDE1E8;
  }
  .key-label{
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    font-weight: bold;
    font-size: 20px;
    fill: white;
    text-anchor: middle;
    pointer-events: none;
  }
  .key-label.key-inactive{
    fill: #B9BFC9;
  }
  .key-label.active{
    fill: #7A5B00;
  }
  .finger{
    fill: #F3B48A;
    stroke: #D98F5F;
    stroke-width: 2;
    opacity: 0.88;
    transition: fill 0.15s ease, transform 0.15s ease;
    transform-origin: center;
  }
  .finger.active{
    fill: var(--berry);
    stroke: #C13E63;
    opacity: 1;
    transform: translateY(-14px);
  }
  .palm{
    fill: #F7C9A6;
    stroke: #D98F5F;
    stroke-width: 2;
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud" style="top:60px; left:60px; width:100px; height:35px;"></div>
<div class="cloud" style="top:90px; left:110px; width:60px; height:25px;"></div>
<div class="cloud" style="top:120px; left:250px; width:70px; height:28px;"></div>

<div class="stage">
  <div class="title">🌟 Type the Letter! 🌟</div>
  <div class="levels">
    <button class="level-btn active" id="lvl1Btn" data-level="1">level 1: a s d f</button>
    <button class="level-btn" id="lvl2Btn" data-level="2">level 2: j k l</button>
    <button class="level-btn" id="lvl3Btn" data-level="3">level 3: all home row</button>
  </div>
  <div class="card">
    <div class="letter" id="letter">a</div>
    <button class="speaker" id="speakerBtn" title="Hear it again">🔊</button>
    <div class="instructions">Press the key you see above!</div>
    <div class="score-row">
      <div>Score: <span id="score">0</span></div>
      <div>Streak: <span id="streak">0</span></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="keyboard-wrap">
      <svg viewBox="0 0 640 220" width="600" height="206">
        <!-- row 1: top row (decorative) -->
        <g id="row1">
          <rect class="key-rect key-inactive" x="67"  y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="91"  y="50">q</text>
          <rect class="key-rect key-inactive" x="121" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="145" y="50">w</text>
          <rect class="key-rect key-inactive" x="175" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="199" y="50">e</text>
          <rect class="key-rect key-inactive" x="229" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="253" y="50">r</text>
          <rect class="key-rect key-inactive" x="283" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="307" y="50">t</text>
          <rect class="key-rect key-inactive" x="337" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="361" y="50">y</text>
          <rect class="key-rect key-inactive" x="391" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="415" y="50">u</text>
          <rect class="key-rect key-inactive" x="445" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="469" y="50">i</text>
          <rect class="key-rect key-inactive" x="499" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="523" y="50">o</text>
          <rect class="key-rect key-inactive" x="553" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="577" y="50">p</text>
        </g>
        <!-- palms sit just above the bottom row, behind the home-row fingers -->
        <g id="palms">
          <rect class="palm" x="34"  y="128" width="222" height="14" rx="7"/>
          <rect class="palm" x="358" y="128" width="222" height="14" rx="7"/>
        </g>
        <!-- row 2: home row (playable) -->
        <g id="row2">
          <rect class="key-rect" id="key-a" x="40"  y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-s" x="94"  y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-d" x="148" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-f" x="202" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect key-inactive" x="256" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect key-inactive" x="310" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-j" x="364" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-k" x="418" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-l" x="472" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect key-inactive" x="526" y="82" width="48" height="48" rx="10"/>
          <!-- fingers rest on top of the home-row keys -->
          <rect class="finger" id="finger-a" x="40"  y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-a" x="64"  y="112">a</text>
          <rect class="finger" id="finger-s" x="94"  y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-s" x="118" y="112">s</text>
          <rect class="finger" id="finger-d" x="148" y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-d" x="172" y="112">d</text>
          <rect class="finger" id="finger-f" x="202" y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-f" x="226" y="112">f</text>
          <text class="key-label key-inactive" x="280" y="112">g</text>
          <text class="key-label key-inactive" x="334" y="112">h</text>
          <rect class="finger" id="finger-j" x="364" y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-j" x="388" y="112">j</text>
          <rect class="finger" id="finger-k" x="418" y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-k" x="442" y="112">k</text>
          <rect class="finger" id="finger-l" x="472" y="82" width="48" height="48" rx="10"/><text class="key-label" id="label-l" x="496" y="112">l</text>
          <rect class="finger" x="526" y="82" width="48" height="48" rx="10" style="fill:#F3B48A; stroke:#D98F5F;"/><text class="key-label" x="550" y="112" style="fill:#6B7280;">;</text>
        </g>
        <!-- row 3: bottom row (decorative) -->
        <g id="row3">
          <rect class="key-rect key-inactive" x="94"  y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="118" y="174">z</text>
          <rect class="key-rect key-inactive" x="148" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="172" y="174">x</text>
          <rect class="key-rect key-inactive" x="202" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="226" y="174">c</text>
          <rect class="key-rect key-inactive" x="256" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="280" y="174">v</text>
          <rect class="key-rect key-inactive" x="310" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="334" y="174">b</text>
          <rect class="key-rect key-inactive" x="364" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="388" y="174">n</text>
          <rect class="key-rect key-inactive" x="418" y="144" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="442" y="174">m</text>
        </g>
      </svg>
    </div>
  </div>
  <button class="restart" id="restartBtn">Reset</button>
</div>

<script>
  const letterEl = document.getElementById('letter');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const feedbackEl = document.getElementById('feedback');
  const restartBtn = document.getElementById('restartBtn');

  const cheer = ["Great job!", "Awesome!", "You got it!", "Super!", "Nice typing!", "Woohoo!"];
  const levels = {
    1: "asdf".split(""),
    2: "jkl".split(""),
    3: "asdfjkl".split("")
  };
  let currentLevel = 1;
  let currentLetterSet = levels[1];

  let score = 0;
  let streak = 0;
  let currentLetter = "";

  function speakLetter(letter){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(letter);
    utter.rate = 0.85;
    utter.pitch = 1.1;
    window.speechSynthesis.speak(utter);
  }

  function pickLetter(){
    currentLetter = currentLetterSet[Math.floor(Math.random() * currentLetterSet.length)];
    letterEl.textContent = currentLetter;
    letterEl.classList.remove('pop');
    highlightHand(currentLetter);
  }

  function highlightHand(letter){
    document.querySelectorAll('.finger').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.key-rect').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.key-label').forEach(el => el.classList.remove('active'));
    const finger = document.getElementById('finger-' + letter);
    const key = document.getElementById('key-' + letter);
    const label = document.getElementById('label-' + letter);
    if(finger) finger.classList.add('active');
    if(key) key.classList.add('active');
    if(label) label.classList.add('active');
  }

  function setLevel(n){
    currentLevel = n;
    currentLetterSet = levels[n];
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.level) === n);
    });
    streak = 0;
    streakEl.textContent = 0;
    feedbackEl.textContent = "";
    pickLetter();
  }

  function popLetter(){
    letterEl.classList.add('pop');
    setTimeout(() => letterEl.classList.remove('pop'), 150);
  }

  function burstStars(){
    for(let i=0;i<5;i++){
      const star = document.createElement('div');
      star.className = 'stars';
      star.textContent = ['⭐','✨','🌟'][Math.floor(Math.random()*3)];
      star.style.left = (40 + Math.random()*20) + 'vw';
      star.style.top = (35 + Math.random()*10) + 'vh';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 900);
    }
  }

  function handleKey(e){
    const pressed = e.key.toLowerCase();
    if(pressed.length !== 1 || !currentLetterSet.includes(pressed)) return;

    if(pressed === currentLetter){
      speakLetter(pressed);
      score++;
      streak++;
      scoreEl.textContent = score;
      streakEl.textContent = streak;
      feedbackEl.textContent = cheer[Math.floor(Math.random()*cheer.length)];
      feedbackEl.className = 'feedback good';
      popLetter();
      burstStars();
      pickLetter();
    } else {
      streak = 0;
      streakEl.textContent = streak;
      feedbackEl.textContent = "Try again! Look for the " + currentLetter;
      feedbackEl.className = 'feedback miss';
    }
  }

  restartBtn.addEventListener('click', () => {
    score = 0; streak = 0;
    scoreEl.textContent = 0; streakEl.textContent = 0;
    feedbackEl.textContent = "";
    pickLetter();
  });

  document.getElementById('speakerBtn').addEventListener('click', () => speakLetter(currentLetter));
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => setLevel(Number(btn.dataset.level)));
  });
  document.addEventListener('keydown', handleKey);
  pickLetter();
</script>

</body>
</html>
