<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kayva's Typing Game</title>
<style>
  :root{
    --sky: #6EC6FF;
    --sun: #FFD23F;
    --grass: #5FD068;
    --berry: #FF6F91;
    --ink: #2B2B3C;
    --card: #FFFFFF;
  }
  html,body{
    margin:0; min-height:100%;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, #BFE9FF 55%, var(--grass) 55%, #7FDB86 100%);
    overflow-x:hidden;
  }
  *{ box-sizing:border-box; }
  .sun{
    position:absolute; top:30px; right:40px;
    width:90px; height:90px; border-radius:50%;
    background: var(--sun);
    box-shadow: 0 0 0 10px rgba(255,210,63,0.35);
  }
  .cloud{
    position:absolute; background:white; border-radius:50px;
    opacity:0.9;
  }
  .stage{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh;
    box-sizing:border-box;
    padding:24px 20px;
    text-align:center;
  }
  .title{
    font-size:2.2rem;
    color:var(--ink);
    text-shadow: 2px 2px 0 white;
    margin-bottom: 10px;
  }
  .card{
    background: var(--card);
    border-radius: 28px;
    padding: 26px 40px 34px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.1);
    display:flex; flex-direction:column; align-items:center;
    width: 100%;
    max-width: 640px;
  }
  .level-heading{
    font-size:1.2rem;
    color: var(--ink);
    font-weight:bold;
    margin-bottom: 12px;
  }
  .keyboard-heading{
    font-size:1rem;
    color: var(--ink);
    opacity:0.7;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:10px;
  }
  .sequence-row{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:16px;
    max-width: 100%;
    margin-bottom: 14px;
  }
  .word-group{
    display:flex; flex-wrap:nowrap;
    gap:6px;
  }
  .seq-box{
    flex-shrink:0;
    width:36px; height:42px;
    border-radius:10px;
    background:#E5E7EB;
    color:#8B93A1;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:1.2rem;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .seq-box.correct{ background: var(--grass); color:white; }
  .seq-box.wrong{ background: var(--berry); color:white; }
  .seq-box.current{ transform: scale(1.18); box-shadow: 0 0 0 3px var(--sky); }

  /* words-mode: real words read as flowing text instead of a tile grid */
  .sequence-row.text-mode{
    gap: 10px 0.55em;
    max-width: 480px;
  }
  .sequence-row.text-mode .word-group{ gap:0; }
  .sequence-row.text-mode .seq-box{
    flex-shrink:0;
    width:auto; height:auto;
    background:none;
    border-radius:0;
    padding:0 0.02em;
    font-size:1.9rem;
    color:#B9BFC9;
    border-bottom:4px solid transparent;
    transform:none;
    box-shadow:none;
  }
  .sequence-row.text-mode .seq-box.correct{ background:none; color:var(--grass); }
  .sequence-row.text-mode .seq-box.wrong{ background:none; color:var(--berry); text-decoration:line-through; }
  .sequence-row.text-mode .seq-box.current{
    transform:none; box-shadow:none;
    border-bottom-color: var(--sky);
    color: var(--ink);
  }
  .instructions{
    font-size:1.05rem;
    color: var(--ink);
    margin-top: 4px;
  }
  .score-row{
    display:flex; gap:30px; margin-top:10px;
    font-size:1.05rem; color: var(--ink);
  }
  .score-row span{ font-weight:bold; }
  .feedback{
    height: 34px;
    font-size:1.3rem;
    margin-top:6px;
    font-weight:bold;
  }
  .feedback.good{ color: var(--grass); }
  .feedback.miss{ color: var(--berry); }
  .stars{
    position:fixed;
    pointer-events:none;
    font-size:2rem;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform: translateY(0) scale(0.6) rotate(0deg); }
    100%{ opacity:0; transform: translateY(-120px) scale(1.4) rotate(30deg); }
  }
  .speaker{
    margin-top:8px;
    background: var(--sky);
    border:none;
    width:44px; height:44px;
    border-radius:50%;
    font-size:1.3rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #4a9fd6;
  }
  .speaker:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #4a9fd6;
  }
  .restart{
    margin-top:16px;
    background: var(--sun);
    border:none;
    padding: 10px 24px;
    border-radius: 20px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow: 0 6px 0 #d9ac1f;
  }
  .restart:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d9ac1f;
  }
  .layout{
    display:flex; align-items:flex-start; justify-content:center;
    gap:16px;
    width:100%; max-width: 860px;
  }
  .sidebar{
    display:flex; flex-direction:column; gap:8px;
    background: var(--card);
    border-radius: 22px;
    padding:16px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.1);
    flex-shrink:0;
  }
  .part-group{
    display:flex; flex-direction:column; align-items:stretch;
    gap:6px;
  }
  .part-group.open{
    background: #F7F8FA;
    border-radius: 12px;
    padding: 6px;
    margin: -6px;
  }
  .part-label{
    display:flex; align-items:center; gap:6px;
    width:100%;
    background:none; border:none; padding:6px 2px;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    font-size:0.75rem; font-weight:bold;
    color: var(--ink); opacity:0.7;
    text-transform:uppercase; letter-spacing:0.5px;
    cursor:pointer;
  }
  .part-arrow{
    font-size:0.65rem;
  }
  .levels{
    display:flex; flex-direction:column; gap:6px;
  }
  .level-btn{ text-align:left; }
  .level-btn{
    background: white;
    border: 3px solid var(--sky);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 16px;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    font-weight:bold;
    cursor:pointer;
  }
  .level-btn.active{
    background: var(--sky);
    color: white;
  }
  .keyboard-wrap{
    margin-top: 10px;
    width: 100%;
  }
  .keyboard-wrap svg{
    width: 100%;
    max-width: 600px;
    height: auto;
    display: block;
    margin: 0 auto;
    touch-action: manipulation;
  }
  .key-hit{
    fill: transparent;
    cursor: pointer;
  }
  .touch-keys{
    display:flex; justify-content:center; align-items:center;
    gap:20px; flex-wrap:wrap;
    margin-top:16px;
  }
  .touch-keys-group{
    display:flex; gap:8px;
  }
  .touch-key{
    width:56px; height:56px;
    min-width:56px; min-height:56px;
    border-radius:14px;
    border:3px solid #C7CCD6;
    background:#EDEFF3;
    color:var(--ink);
    font-family:'Comic Sans MS', 'Segoe UI', sans-serif;
    font-weight:bold; font-size:1.5rem;
    cursor:pointer;
    touch-action:manipulation;
    transition: background 0.1s ease, transform 0.1s ease, opacity 0.15s ease;
  }
  .touch-key:active{ transform:scale(0.92); }
  .touch-key.active{ background:var(--sun); border-color:#D9AC1F; }
  .touch-key.level-dim{ opacity:0.35; }
  .key-rect{
    fill: #EDEFF3;
    stroke: #C7CCD6;
    stroke-width: 2;
    transition: fill 0.15s ease, transform 0.15s ease;
  }
  .key-rect.active{
    fill: var(--sun);
    stroke: #D9AC1F;
  }
  .key-rect.key-inactive{
    fill: #F5F6F8;
    stroke: #DDE1E8;
  }
  .key-label{
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    font-weight: bold;
    font-size: 20px;
    fill: #6B7280;
    text-anchor: middle;
    pointer-events: none;
  }
  .key-label.key-inactive{
    fill: #B9BFC9;
  }
  .key-label.active{
    fill: #7A5B00;
  }
  .finger{
    fill: #F3B48A;
    stroke: #D98F5F;
    stroke-width: 2;
    opacity: 0.5;
    transition: fill 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    transform-origin: center;
  }
  .finger.level-dim{
    opacity: 0.15;
  }
  .finger.active{
    fill: var(--berry);
    stroke: #C13E63;
    opacity: 0.92;
    transform: translateY(-8px);
  }
  .thumb{
    fill: #F3B48A;
    stroke: #D98F5F;
    stroke-width: 2;
    opacity: 0.5;
  }
  .palm{
    fill: #F7C9A6;
    stroke: #D98F5F;
    stroke-width: 2;
    opacity: 0.5;
  }
  .popup-overlay{
    position:fixed; inset:0;
    background: rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
  }
  .popup-card{
    background:white;
    border-radius: 26px;
    padding: 34px 44px;
    text-align:center;
    box-shadow: 0 14px 0 rgba(0,0,0,0.15);
    max-width: 360px;
  }
  .popup-title{
    font-size:1.8rem;
    color:var(--ink);
    margin-bottom: 10px;
  }
  .popup-stars{
    font-size:2.6rem;
    letter-spacing: 8px;
    color: var(--sun);
    margin-bottom: 12px;
  }
  .popup-sub{
    font-size:1.05rem;
    color: var(--ink);
    margin-bottom: 22px;
  }
  .popup-buttons{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  .popup-buttons button{
    padding: 10px 20px;
    border:none;
    border-radius: 16px;
    font-weight:bold;
    cursor:pointer;
    font-family: inherit;
    font-size: 0.95rem;
  }
  #repeatBtn{ background:#E5E7EB; color:var(--ink); }
  #nextBtn{ background: var(--grass); color:white; }

  @media (max-width: 760px){
    .layout{ flex-direction:column; align-items:center; }
    .sidebar{ width:100%; max-width:600px; }
    .part-group{ align-items:center; }
    .part-label{ justify-content:center; }
    .levels{ flex-direction:row; flex-wrap:wrap; justify-content:center; }
    .level-btn{ text-align:center; }
  }

  @media (max-width: 480px){
    .title{ font-size:1.5rem; }
    .card{ padding:18px 14px 22px; border-radius:20px; }
    .level-heading{ font-size:1rem; }
    .seq-box{ width:28px; height:34px; font-size:1rem; }
    .sequence-row.text-mode .seq-box{ width:auto; height:auto; font-size:1.4rem; }
    .instructions{ font-size:0.9rem; }
    .score-row{ font-size:0.9rem; gap:18px; }
    .level-btn{ font-size:0.75rem; padding:6px 10px; }
    .stage{ padding:14px 10px; }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud" style="top:60px; left:60px; width:100px; height:35px;"></div>
<div class="cloud" style="top:90px; left:110px; width:60px; height:25px;"></div>
<div class="cloud" style="top:120px; left:250px; width:70px; height:28px;"></div>

<div class="stage">
  <div class="title">🌟 Kayva's Typing Game 🌟</div>

  <div class="layout">
    <aside class="sidebar" id="levelBtns"></aside>

    <div class="card">
      <div class="level-heading" id="levelHeading">Level 1</div>
      <div class="sequence-row" id="sequenceRow"></div>
      <button class="speaker" id="speakerBtn" title="Hear it again">🔊</button>
      <div class="instructions">Type the highlighted letter!</div>
      <div class="score-row">
        <div>Mistakes: <span id="mistakes">0</span></div>
        <div>Streak: <span id="streak">0</span></div>
      </div>
      <div class="feedback" id="feedback"></div>

      <div class="keyboard-heading">Home Row</div>
      <div class="keyboard-wrap">
      <svg viewBox="0 0 640 260">
        <!-- row 1: top row (decorative) -->
        <g id="row1">
          <rect class="key-rect key-inactive" x="67"  y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="91"  y="50">q</text>
          <rect class="key-rect key-inactive" x="121" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="145" y="50">w</text>
          <rect class="key-rect key-inactive" x="175" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="199" y="50">e</text>
          <rect class="key-rect key-inactive" x="229" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="253" y="50">r</text>
          <rect class="key-rect key-inactive" x="283" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="307" y="50">t</text>
          <rect class="key-rect key-inactive" x="337" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="361" y="50">y</text>
          <rect class="key-rect key-inactive" x="391" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="415" y="50">u</text>
          <rect class="key-rect key-inactive" x="445" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="469" y="50">i</text>
          <rect class="key-rect key-inactive" x="499" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="523" y="50">o</text>
          <rect class="key-rect key-inactive" x="553" y="20" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="577" y="50">p</text>
        </g>
        <!-- palms -->
        <g id="palms">
          <rect class="palm" x="34"  y="130" width="222" height="48" rx="20"/>
          <rect class="palm" x="358" y="130" width="222" height="48" rx="20"/>
          <rect class="thumb" x="243" y="172" width="14" height="40" rx="7" transform="rotate(40 250 172)"/>
          <rect class="thumb" x="357" y="172" width="14" height="40" rx="7" transform="rotate(-40 364 172)"/>
        </g>
        <!-- row 2: home row (playable) -->
        <g id="row2keys">
          <rect class="key-rect" id="key-a" x="40"  y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-s" x="94"  y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-d" x="148" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-f" x="202" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-g" x="256" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-h" x="310" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-j" x="364" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-k" x="418" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect" id="key-l" x="472" y="82" width="48" height="48" rx="10"/>
          <rect class="key-rect key-inactive" x="526" y="82" width="48" height="48" rx="10"/>
          <text class="key-label" id="label-a" x="64"  y="112">a</text>
          <text class="key-label" id="label-s" x="118" y="112">s</text>
          <text class="key-label" id="label-d" x="172" y="112">d</text>
          <text class="key-label" id="label-f" x="226" y="112">f</text>
          <text class="key-label" id="label-g" x="280" y="112">g</text>
          <text class="key-label" id="label-h" x="334" y="112">h</text>
          <text class="key-label" id="label-j" x="388" y="112">j</text>
          <text class="key-label" id="label-k" x="442" y="112">k</text>
          <text class="key-label" id="label-l" x="496" y="112">l</text>
          <text class="key-label key-inactive" x="550" y="112">;</text>
        </g>
        <!-- fingers, drawn on top so they sit above the keys, reaching down into the palm -->
        <g id="fingers">
          <rect class="finger" id="finger-a" x="47"  y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-s" x="101" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-d" x="155" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-f" x="209" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-g" x="263" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-h" x="317" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-j" x="371" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-k" x="425" y="72" width="34" height="58" rx="17"/>
          <rect class="finger" id="finger-l" x="479" y="72" width="34" height="58" rx="17"/>
          <rect class="finger level-dim" x="533" y="72" width="34" height="58" rx="17"/>
        </g>
        <!-- transparent tap targets, sized to cover both the key and the finger above it, for touchscreens -->
        <g id="hitboxes">
          <rect class="key-hit" data-letter="a" x="40"  y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="s" x="94"  y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="d" x="148" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="f" x="202" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="g" x="256" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="h" x="310" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="j" x="364" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="k" x="418" y="72" width="48" height="58" rx="12"/>
          <rect class="key-hit" data-letter="l" x="472" y="72" width="48" height="58" rx="12"/>
        </g>
        <!-- row 3: bottom row (decorative) -->
        <g id="row3">
          <rect class="key-rect key-inactive" x="94"  y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="118" y="222">z</text>
          <rect class="key-rect key-inactive" x="148" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="172" y="222">x</text>
          <rect class="key-rect key-inactive" x="202" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="226" y="222">c</text>
          <rect class="key-rect key-inactive" x="256" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="280" y="222">v</text>
          <rect class="key-rect key-inactive" x="310" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="334" y="222">b</text>
          <rect class="key-rect key-inactive" x="364" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="388" y="222">n</text>
          <rect class="key-rect key-inactive" x="418" y="192" width="48" height="48" rx="10"/><text class="key-label key-inactive" x="442" y="222">m</text>
        </g>
      </svg>
    </div>

      <div class="touch-keys" id="touchKeys">
        <div class="touch-keys-group">
          <button class="touch-key" data-letter="a">a</button>
          <button class="touch-key" data-letter="s">s</button>
          <button class="touch-key" data-letter="d">d</button>
          <button class="touch-key" data-letter="f">f</button>
          <button class="touch-key" data-letter="g">g</button>
        </div>
        <div class="touch-keys-group">
          <button class="touch-key" data-letter="h">h</button>
          <button class="touch-key" data-letter="j">j</button>
          <button class="touch-key" data-letter="k">k</button>
          <button class="touch-key" data-letter="l">l</button>
        </div>
      </div>
    </div>
  </div>

  <button class="restart" id="restartBtn">Reset</button>
</div>

<div class="popup-overlay" id="popupOverlay" style="display:none;">
  <div class="popup-card">
    <div class="popup-title">Level Complete! 🎉</div>
    <div class="popup-stars" id="popupStars">★★★</div>
    <div class="popup-sub" id="popupSub">Great job!</div>
    <div class="popup-buttons">
      <button id="repeatBtn">Repeat Level</button>
      <button id="nextBtn">Next Level</button>
    </div>
  </div>
</div>

<script>
  const PARTS = [
    { label: "Part 1: a s d f" },
    { label: "Part 2: j k l" },
    { label: "Part 3: g h" }
  ];

  const LEVELS = [
    { title: "Level 1: a s d f in a row",     type:'blocks', keys:['a','s','d','f'], repeat:4, part:0 },
    { title: "Level 2: a & f",                type:'pair',   letters:['a','f'], wordLen:6, wordCount:4, part:0 },
    { title: "Level 3: s & d",                type:'pair',   letters:['s','d'], wordLen:6, wordCount:4, part:0 },
    { title: "Level 4: d & f",                type:'pair',   letters:['d','f'], wordLen:6, wordCount:4, part:0 },
    { title: "Level 5: a & s",                type:'pair',   letters:['a','s'], wordLen:6, wordCount:4, part:0 },
    { title: "Level 6: a s d f in triples",   type:'combo',  keys:['a','s','d','f'], comboSize:3, wordCount:4, part:0 },
    { title: "Level 7: a s d f mixed up",     type:'random', keys:['a','s','d','f'], length:16, part:0 },
    { title: "Level 8: asdf words",           type:'words',  words:['dad','sad','fad','add','fads'], part:0 },
    { title: "Level 9: j k l in a row",       type:'blocks', keys:['j','k','l'], repeat:4, part:1 },
    { title: "Level 10: j & k",               type:'pair',   letters:['j','k'], wordLen:6, wordCount:4, part:1 },
    { title: "Level 11: k & l",               type:'pair',   letters:['k','l'], wordLen:6, wordCount:4, part:1 },
    { title: "Level 12: j & l",               type:'pair',   letters:['j','l'], wordLen:6, wordCount:4, part:1 },
    { title: "Level 13: j k l in triples",    type:'combo',  keys:['j','k','l'], comboSize:3, wordCount:4, part:1 },
    { title: "Level 14: j k l mixed up",      type:'random', keys:['j','k','l'], length:12, part:1 },
    { title: "Level 15: asdf + jkl words",    type:'words',  words:['salad','flask','falls'], part:1 },
    { title: "Level 16: g h in a row",        type:'blocks', keys:['g','h'], repeat:4, part:2 },
    { title: "Level 17: g & h",               type:'pair',   letters:['g','h'], wordLen:6, wordCount:4, part:2 },
    { title: "Level 18: full home row words", type:'words',  words:['flag','flash','half','hall','glass','shall','slash','dash'], part:2 }
  ];

  const cheer = ["Great job!", "Awesome!", "You got it!", "Super!", "Nice typing!", "Woohoo!"];

  const sequenceRow = document.getElementById('sequenceRow');
  const levelHeading = document.getElementById('levelHeading');
  const mistakesEl = document.getElementById('mistakes');
  const streakEl = document.getElementById('streak');
  const feedbackEl = document.getElementById('feedback');
  const restartBtn = document.getElementById('restartBtn');
  const levelBtnsWrap = document.getElementById('levelBtns');
  const popupOverlay = document.getElementById('popupOverlay');
  const popupStars = document.getElementById('popupStars');
  const popupSub = document.getElementById('popupSub');

  let currentLevelIndex = 0;
  let chars = [];
  let boundaries = new Set();
  let currentIndex = 0;
  let mistakesThisLevel = 0;
  let streak = 0;
  let locked = false; // true while popup is showing

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  const MAX_RUN = 3;

  // Fills `length` letters from `pool` into `seq`, keeping each letter's count
  // as equal as possible (rather than independent random picks, which can
  // easily favor one letter over the others) while never exceeding MAX_RUN
  // identical letters in a row.
  function pushBalanced(seq, pool, length){
    const base = Math.floor(length / pool.length);
    let remainder = length % pool.length;
    const counts = {};
    pool.forEach(c => counts[c] = base);
    shuffle(pool).slice(0, remainder).forEach(c => counts[c]++);

    for(let i=0;i<length;i++){
      let blocked = null;
      if(seq.length){
        const last = seq[seq.length - 1];
        let runLen = 0;
        for(let j=seq.length-1; j>=0 && seq[j]===last; j--) runLen++;
        if(runLen >= MAX_RUN) blocked = last;
      }
      let candidates = pool.filter(c => counts[c] > 0 && c !== blocked);
      if(candidates.length === 0) candidates = pool.filter(c => counts[c] > 0);
      const maxCount = Math.max(...candidates.map(c => counts[c]));
      const topCandidates = candidates.filter(c => counts[c] === maxCount);
      const pick = topCandidates[Math.floor(Math.random()*topCandidates.length)];
      seq.push(pick);
      counts[pick]--;
    }
  }

  function combinations(arr, k){
    const results = [];
    (function pick(start, combo){
      if(combo.length === k){ results.push(combo.slice()); return; }
      for(let i=start;i<arr.length;i++){
        combo.push(arr[i]);
        pick(i+1, combo);
        combo.pop();
      }
    })(0, []);
    return results;
  }

  function buildSequence(level){
    let seq = [];
    let bounds = new Set();
    if(level.type === 'blocks'){
      level.keys.forEach(k => {
        for(let i=0;i<level.repeat;i++) seq.push(k);
        bounds.add(seq.length - 1);
      });
    } else if(level.type === 'random'){
      pushBalanced(seq, level.keys, level.length);
      for(let i=3;i<level.length;i+=4) bounds.add(i);
      if((level.length - 1) % 4 !== 3) bounds.add(level.length - 1);
    } else if(level.type === 'pair'){
      const [x, y] = level.letters;
      for(let i=0;i<level.wordLen;i++) seq.push(i % 2 === 0 ? x : y);
      bounds.add(seq.length - 1);
      for(let w=1; w<level.wordCount; w++){
        pushBalanced(seq, level.letters, level.wordLen);
        bounds.add(seq.length - 1);
      }
    } else if(level.type === 'combo'){
      const wordLen = level.comboSize + 2;
      const subsets = shuffle(combinations(level.keys, level.comboSize));
      for(let w=0; w<level.wordCount; w++){
        const pool = subsets[w % subsets.length];
        pushBalanced(seq, pool, wordLen);
        bounds.add(seq.length - 1);
      }
    } else if(level.type === 'words'){
      shuffle(level.words).forEach(w => {
        w.split('').forEach(c => seq.push(c));
        bounds.add(seq.length - 1);
      });
    }
    return { seq, bounds };
  }

  let expandedPart = 0;

  function renderLevelButtons(){
    levelBtnsWrap.innerHTML = '';
    PARTS.forEach((part, partIdx) => {
      const isOpen = partIdx === expandedPart;
      const group = document.createElement('div');
      group.className = 'part-group' + (isOpen ? ' open' : '');

      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'part-label';
      label.innerHTML = '<span class="part-arrow">' + (isOpen ? '▾' : '▸') + '</span> ' + part.label;
      label.addEventListener('click', () => {
        expandedPart = isOpen ? -1 : partIdx;
        renderLevelButtons();
      });
      group.appendChild(label);

      const row = document.createElement('div');
      row.className = 'levels';
      if(!isOpen) row.style.display = 'none';
      LEVELS.forEach((lvl, i) => {
        if(lvl.part !== partIdx) return;
        const btn = document.createElement('button');
        btn.className = 'level-btn' + (i === currentLevelIndex ? ' active' : '');
        btn.textContent = 'Level ' + (i+1);
        btn.addEventListener('click', () => loadLevel(i));
        row.appendChild(btn);
      });
      group.appendChild(row);
      levelBtnsWrap.appendChild(group);
    });
  }

  const HOME_ROW = ['a','s','d','f','g','h','j','k','l'];

  function levelLetters(level){
    if(level.keys) return level.keys;
    if(level.letters) return level.letters;
    if(level.words) return Array.from(new Set(level.words.join('').split('')));
    return [];
  }

  function updateKeyboardHighlight(level){
    const used = new Set(levelLetters(level));
    HOME_ROW.forEach(letter => {
      const inUse = used.has(letter);
      const key = document.getElementById('key-' + letter);
      const label = document.getElementById('label-' + letter);
      const finger = document.getElementById('finger-' + letter);
      const touchKey = document.querySelector('.touch-key[data-letter="' + letter + '"]');
      if(key) key.classList.toggle('key-inactive', !inUse);
      if(label) label.classList.toggle('key-inactive', !inUse);
      if(finger) finger.classList.toggle('level-dim', !inUse);
      if(touchKey) touchKey.classList.toggle('level-dim', !inUse);
    });
  }

  function makeSeqBox(i){
    const box = document.createElement('div');
    box.className = 'seq-box';
    box.id = 'seq-' + i;
    box.textContent = chars[i];
    return box;
  }

  function renderSequence(isWordsStyle){
    sequenceRow.innerHTML = '';
    sequenceRow.classList.toggle('text-mode', !!isWordsStyle);
    const sortedBounds = Array.from(boundaries).sort((a,b) => a-b);
    let groupStart = 0;
    sortedBounds.forEach(groupEnd => {
      const group = document.createElement('div');
      group.className = 'word-group';
      for(let i=groupStart; i<=groupEnd; i++) group.appendChild(makeSeqBox(i));
      sequenceRow.appendChild(group);
      groupStart = groupEnd + 1;
    });
    if(groupStart < chars.length){
      const group = document.createElement('div');
      group.className = 'word-group';
      for(let i=groupStart; i<chars.length; i++) group.appendChild(makeSeqBox(i));
      sequenceRow.appendChild(group);
    }
  }

  function loadLevel(i){
    currentLevelIndex = i;
    const level = LEVELS[i];
    expandedPart = level.part;
    updateKeyboardHighlight(level);
    const built = buildSequence(level);
    chars = built.seq;
    boundaries = built.bounds;
    currentIndex = 0;
    mistakesThisLevel = 0;
    streak = 0;
    locked = false;
    levelHeading.textContent = level.title;
    mistakesEl.textContent = 0;
    streakEl.textContent = 0;
    feedbackEl.textContent = '';
    popupOverlay.style.display = 'none';
    renderLevelButtons();
    renderSequence(level.type === 'words');
    highlightCurrent();
  }

  function currentLetter(){
    return chars[currentIndex];
  }

  function highlightCurrent(){
    document.querySelectorAll('.seq-box').forEach(el => el.classList.remove('current'));
    const box = document.getElementById('seq-' + currentIndex);
    if(box) box.classList.add('current');
    highlightHand(currentLetter());
  }

  function highlightHand(letter){
    document.querySelectorAll('.finger').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.key-rect').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.key-label').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.touch-key').forEach(el => el.classList.remove('active'));
    const finger = document.getElementById('finger-' + letter);
    const key = document.getElementById('key-' + letter);
    const touchKey = document.querySelector('.touch-key[data-letter="' + letter + '"]');
    if(finger) finger.classList.add('active');
    if(key){
      key.classList.add('active');
    }
    if(touchKey) touchKey.classList.add('active');
  }

  function speakLetter(letter){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(letter);
    utter.rate = 0.85;
    utter.pitch = 1.1;
    window.speechSynthesis.speak(utter);
  }

  function burstStars(){
    for(let i=0;i<5;i++){
      const star = document.createElement('div');
      star.className = 'stars';
      star.textContent = ['⭐','✨','🌟'][Math.floor(Math.random()*3)];
      star.style.left = (40 + Math.random()*20) + 'vw';
      star.style.top = (35 + Math.random()*10) + 'vh';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 900);
    }
  }

  function starsForLevel(mistakes, length){
    if(mistakes === 0) return 3;
    if(mistakes <= Math.max(1, Math.round(length * 0.15))) return 2;
    return 1;
  }

  function showLevelComplete(){
    locked = true;
    const stars = starsForLevel(mistakesThisLevel, chars.length);
    popupStars.textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    if(stars === 3){
      popupSub.textContent = 'Perfect! No mistakes!';
    } else if(stars === 2){
      popupSub.textContent = 'Nice work! ' + mistakesThisLevel + ' mix-up' + (mistakesThisLevel===1?'':'s') + '.';
    } else {
      popupSub.textContent = 'Keep practicing! ' + mistakesThisLevel + ' mix-ups.';
    }
    const nextBtn = document.getElementById('nextBtn');
    if(currentLevelIndex === LEVELS.length - 1){
      nextBtn.textContent = 'All Levels Done! 🏆';
      nextBtn.disabled = false;
    } else {
      nextBtn.textContent = 'Next Level';
      nextBtn.disabled = false;
    }
    popupOverlay.style.display = 'flex';
  }

  function handleKey(e){
    if(locked) return;
    const pressed = e.key.toLowerCase();
    if(pressed.length !== 1 || !/[a-z]/.test(pressed)) return;
    processLetter(pressed);
  }

  function processLetter(pressed){
    if(locked) return;
    const expected = currentLetter();
    const box = document.getElementById('seq-' + currentIndex);

    if(pressed === expected){
      speakLetter(pressed);
      box.classList.add('correct');
      streak++;
      streakEl.textContent = streak;
      feedbackEl.textContent = cheer[Math.floor(Math.random()*cheer.length)];
      feedbackEl.className = 'feedback good';
      burstStars();
    } else {
      mistakesThisLevel++;
      mistakesEl.textContent = mistakesThisLevel;
      streak = 0;
      streakEl.textContent = 0;
      box.classList.add('wrong');
      feedbackEl.textContent = 'That was the ' + expected.toUpperCase() + ' key!';
      feedbackEl.className = 'feedback miss';
    }

    currentIndex++;
    if(currentIndex >= chars.length){
      showLevelComplete();
    } else {
      highlightCurrent();
    }
  }

  restartBtn.addEventListener('click', () => loadLevel(currentLevelIndex));

  document.getElementById('speakerBtn').addEventListener('click', () => speakLetter(currentLetter()));

  document.getElementById('repeatBtn').addEventListener('click', () => loadLevel(currentLevelIndex));

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(currentLevelIndex < LEVELS.length - 1){
      loadLevel(currentLevelIndex + 1);
    } else {
      popupOverlay.style.display = 'none';
    }
  });

  document.addEventListener('keydown', handleKey);

  document.querySelectorAll('.key-hit').forEach(hit => {
    hit.addEventListener('click', () => processLetter(hit.dataset.letter));
  });

  document.querySelectorAll('.touch-key').forEach(btn => {
    btn.addEventListener('click', () => processLetter(btn.dataset.letter));
  });

  loadLevel(0);
</script>

</body>
</html>
